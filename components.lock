# LeopardOS release lock: component repositories and the
# exact commits a release uses.  tag is human-readable; rev is
# authoritative.  Refresh with: ./leopard-src lock --update
#
# Format:
#   [component]
#   repo = "git@github.com:leopard-project/<name>.git"
#   path = "../<name>"
#   tag  = "<exact tag, empty if untagged>"
#   rev  = "<commit>"

