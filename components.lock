# LeopardOS release lock: component repositories and the commits a release uses.
# `leopard-src sync` currently reads component out/ directories; this file is
# the intended source of truth once fetch/build is wired.
#
# Format:
#   [component]
#   repo = "git@github.com:leopard-project/<name>.git"
#   rev  = "<commit>"

[OpenXSBoot]
repo = "git@github.com:leopard-project/OpenXSBoot.git"
rev  = "2665e0d"

